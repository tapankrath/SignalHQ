name: Update ticker universe
on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  update-universe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Build universe
        run: python -u scripts/build_universe.py
      - name: Commit updated universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add universe.json
          git diff --quiet --cached || git commit -m "Update ticker universe [automated]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "Push attempt $attempt failed — retrying after rebase..."
            sleep 5
          done
