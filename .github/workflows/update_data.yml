name: Update EOD options data

# NOTE (2026-09-16): scheduled runs stopped firing after the Sep 15 6:15 PM ET
# post-close run — no run at all (not even a failed one) for the 9:30/10:30 AM
# ET slots on Sep 16, a normal trading day. This is a no-op comment-only commit
# to re-touch the workflow file on `main`, since GitHub's scheduler is keyed
# off the latest commit and a stuck/stale scheduler state sometimes clears on
# the next push to the file. No change to the actual schedule or job below.
on:
  schedule:
    # Hourly during the US trading session (9:30am-3:30pm ET), Mon-Fri, plus a
    # dedicated post-close run at 6:15 PM ET for the "official" EOD snapshot.
    # GitHub Actions cron is always UTC and does NOT auto-adjust for daylight
    # saving, so each target window needs two entries — one for EDT (UTC-4,
    # roughly March-October) and one for EST (UTC-5, roughly November-
    # February) — using cron's month field to pick the right one automatically.
    # Approximation: DST actually flips on specific Sundays in March/November,
    # not clean month boundaries, so the first ~1 week of March and November
    # can be off by an hour until the month field catches up. Accepted as a
    # reasonable tradeoff rather than building exact Sunday-based logic.
    #
    # EDT months (~Mar-Oct):
    - cron: '30 13-19 * 3-10 1-5'   # hourly at :30, 9:30 AM - 3:30 PM ET
    - cron: '15 22 * 3-10 1-5'      # 6:15 PM ET (post-close EOD snapshot)
    # EST months (~Nov-Feb):
    - cron: '30 14-20 * 11,12,1,2 1-5'  # hourly at :30, 9:30 AM - 3:30 PM ET
    - cron: '15 23 * 11,12,1,2 1-5'     # 6:15 PM ET (post-close EOD snapshot)
    # GitHub's schedule can lag by several minutes under load — fine for this.
    # NOTE: this is 8 runs/weekday (up from 3) against Yahoo's free/unofficial
    # yfinance feed, which the fetch script's own docstring already flags as
    # rate-limit-prone from shared CI IPs. If runs start failing/getting
    # skipped more often, drop back toward fewer, wider-spaced entries.
  workflow_dispatch:
    inputs:
      ticker:
        description: 'On-demand lookup: a single ticker symbol (leave blank for a normal full-watchlist run)'
        required: false
        default: ''

permissions:
  contents: write

# Added 2026-09-19 alongside the `ticker` input above, for the on-demand
# lookup feature: repeated lookups of the SAME ticker (someone double-
# clicking, or retrying) queue behind each other instead of running
# concurrently and racing to write lookup.json — cancel-in-progress is
# deliberately false so a run already in flight finishes and commits rather
# than being killed mid-write. A lookup for a DIFFERENT ticker gets its own
# group, so it's never blocked by one already in flight.
#
# Updated 2026-09-19 (again) when the "Hard Refresh" button was added to the
# frontend, giving the full no-ticker batch a second way to fire on top of
# the schedule: every no-ticker run (scheduled OR manually triggered via Hard
# Refresh) now shares one fixed 'batch' group instead of each getting its own
# via a run-id fallback. That fallback would have let a manual Hard Refresh
# run at the exact same time as a scheduled run — doubling the request volume
# against Yahoo's already rate-limit-prone free feed for no reason. Sharing
# one group means they queue instead: whichever started first finishes, then
# the other runs (or, with cancel-in-progress false, both eventually
# complete) — never two full-watchlist runs hitting Yahoo simultaneously.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.ticker || 'batch' }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch data
        env:
          LOOKUP_TICKER: ${{ github.event.inputs.ticker }}
        run: |
          if [ -n "$LOOKUP_TICKER" ]; then
            python -u scripts/fetch_data.py --ticker "$LOOKUP_TICKER"
          else
            python -u scripts/fetch_data.py
          fi

      - name: Commit updated data
        env:
          LOOKUP_TICKER: ${{ github.event.inputs.ticker }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$LOOKUP_TICKER" ]; then
            # Lookup mode only ever touches lookup.json — data.json is
            # intentionally left alone (see run_lookup() in fetch_data.py).
            git add lookup.json
            git diff --quiet --cached || git commit -m "On-demand lookup: $LOOKUP_TICKER [automated]"
          else
            git add data.json
            git diff --quiet --cached || git commit -m "Update EOD options data [automated]"
          fi
          # Fetching data can take a minute or more — if a human commit landed on
          # main while this was running, a plain push gets rejected as non-fast-
          # forward. Rebasing picks up that intervening commit, but data.json is
          # a purely generated file — if BOTH the intervening commit and this run
          # touched it, there's no sane line-by-line merge of two different JSON
          # snapshots, so git flags a real conflict instead of guessing.
          #
          # Fix: -X theirs tells git to auto-resolve any data.json conflict by
          # keeping THIS run's freshly-generated version. Confirmed empirically
          # before shipping — git's ours/theirs meaning is inverted during a
          # rebase (a well-known gotcha), so -X ours would have silently kept
          # the OLDER content instead, which is the opposite of what we want.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs --autostash origin main && git push && break
            echo "Push attempt $attempt failed — retrying after rebase..."
            sleep 5
          done
